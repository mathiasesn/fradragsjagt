name: CI

on:
  push:
    branches: [main]
  pull_request:

# Kør al Python-værktøj fra backend/, hvor pyproject.toml + uv.lock nu bor.
defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: ruff check
        run: uv run --with ruff ruff check core cli tests
      - name: ruff format --check
        run: uv run --with ruff ruff format --check core cli tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: pytest
        run: uv run --with pytest --with pypdf python -m pytest -q
