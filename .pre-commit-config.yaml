# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Tilpasset fra fastapi/full-stack-fastapi-template. Kun backend (Python) —
# frontend/biome, mypy/ty, SDK-gen og zizmor er udeladt indtil de bliver relevante.
# `typos` er bevidst udeladt, da kodebasen er på dansk (mange falske positiver).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --force-exclude
        require_serial: true
        language: system
        types: [python]
